[package]
name = "plan-atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local app that aggregates Claude Code plans into one searchable, browsable place"
license = "MIT"
repository = "https://github.com/WiK1ngST/plan-atlas"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.3"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
