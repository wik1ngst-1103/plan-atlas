[package]
name = "plan-atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Local app that aggregates Claude Code plans into one searchable, browsable place"
license = "MIT"
repository = "https://github.com/WiK1ngST/plan-atlas"
homepage = "https://github.com/WiK1ngST/plan-atlas"
readme = "README.md"

[dependencies]
anyhow = "1.0.105"
blake3 = "1.8.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7.0.0"
notify-debouncer-full = "0.7.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
axum = "0.8"
futures-util = { version = "0.3", default-features = false }
tokio = { version = "1.54.1", features = ["sync", "rt-multi-thread", "macros", "time", "net", "signal", "io-util"] }
toml = "1.2.3"
ts-rs = "12.0.1"
unicode-normalization = "0.1.26"
rmcp = { version = "3.12.0", default-features = false, features = ["server", "macros", "transport-io"] }
schemars = "1.2.3"
time = { version = "0.3.55", features = ["local-offset"] }
webbrowser = "1.2.7"
rust-embed = { version = "8", default-features = false, features = ["debug-embed"] }
mime_guess = "2.0.5"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3.27.0"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
