[package]
name = "plan-atlas"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Local app that aggregates Claude Code plans into one searchable, browsable place"
license = "MIT"
repository = "https://github.com/WiK1ngST/plan-atlas"
readme = "README.md"

[dependencies]
blake3 = "1.8.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "7.0.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_yaml_ng = "0.10.0"
toml = "1.2.3"
ts-rs = "12.0.1"
unicode-normalization = "0.1.26"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_json = "1.0.154"
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "unwind"
