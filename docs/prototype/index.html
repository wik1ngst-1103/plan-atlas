<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan Atlas</title>
<style>
:root{--bg:#f6f6f3;--panel:#fff;--ink:#1c1c1a;--mute:#6b6b66;--faint:#9a9a93;--line:#e5e4df;--accent:#3b5bdb;--accent-soft:#eef1fb;--ok:#2b8a3e;--ok-soft:#e9f6ec;--warn:#d9480f;--warn-soft:#fff1e6;--run:#1971c2;--run-soft:#e7f1fb;--tech:#e6f4ea;--techi:#2b8a3e;--type:#f1f0ec;--typei:#55554f;--shadow:0 10px 40px rgba(0,0,0,.14)}
@media (prefers-color-scheme:dark){:root{--bg:#141413;--panel:#1d1d1b;--ink:#ecebe6;--mute:#a3a39c;--faint:#77776f;--line:#2e2e2b;--accent:#8ea4ff;--accent-soft:#23263a;--ok:#69db7c;--ok-soft:#1c2e21;--warn:#ffa94d;--warn-soft:#33261a;--run:#74c0fc;--run-soft:#1a2733;--tech:#1f3326;--techi:#8ce99a;--type:#2a2a27;--typei:#c9c8c1;--shadow:0 10px 40px rgba(0,0,0,.5)}}
*{box-sizing:border-box}
body{margin:0;font:14px/1.55 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--accent);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
button,select{font:inherit;font-size:13px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{border-color:var(--accent)}
.shell{display:grid;grid-template-columns:232px 1fr;grid-template-rows:56px 1fr;height:100vh}
.top{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font-weight:700;font-size:15px;width:196px;flex:none}
.crumbs{flex:1;min-width:0;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumbs b{color:var(--ink);font-weight:600}.crumbs .sep{margin:0 8px;color:var(--faint)}
.search{position:relative;width:min(440px,42vw);flex:none}
.search input{width:100%;font:inherit;padding:7px 34px 7px 34px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);border-color:transparent;background:var(--panel)}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font:11px ui-monospace,monospace;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;pointer-events:none}
.sres{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);max-height:72vh;overflow:auto;padding:6px;display:none;z-index:30}
.sres.on{display:block}
.sres h6{margin:10px 8px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.sitem{display:flex;gap:10px;align-items:center;padding:8px;border-radius:8px;cursor:pointer}
.sitem.on,.sitem:hover{background:var(--accent-soft)}
.sitem .m{flex:1;min-width:0}.sitem .s{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sitem .ico{width:18px;text-align:center;flex:none}
mark{background:#ffe8a3;color:inherit;border-radius:2px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:rgba(255,212,59,.3)}}
.sfoot{font-size:11.5px;color:var(--faint);padding:8px 8px 4px;border-top:1px solid var(--line);margin-top:6px}
.snone{padding:14px 8px;color:var(--mute)}
.livepill{display:flex;align-items:center;gap:8px;border-radius:99px;background:var(--run-soft);color:var(--run);border:0;font-weight:600}
.side{border-right:1px solid var(--line);padding:14px 12px;overflow:auto;background:var(--panel)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);cursor:pointer}
.nav:hover{background:var(--accent-soft);text-decoration:none}.nav.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .n{margin-left:auto;color:var(--faint);font-size:12px;font-weight:400}
.side h6{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin:20px 10px 6px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
main{overflow:auto;min-width:0}
.page{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
.page-title{font-size:24px;margin:0 0 4px}.lead{color:var(--mute);margin:0 0 22px;max-width:720px}
.kind{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint);font-weight:600;margin-bottom:4px}
h2.sec{font-size:15px;margin:30px 0 12px;display:flex;align-items:center;gap:8px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 16px;min-width:130px}
.stat b{display:block;font-size:22px}.stat span{color:var(--mute);font-size:12px}
.grid{display:grid;align-items:start;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.plan-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:8px;transition:border-color .15s,box-shadow .15s}
.plan-card:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.plan-card h3{margin:0;font-size:16px;line-height:1.35}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar b{display:block;height:100%;background:var(--ok);border-radius:3px}
.meta{color:var(--mute);font-size:12.5px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:1px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent);border:0;margin:0 4px 4px 0;cursor:pointer}
.chip:hover{outline:1px solid currentColor}
.chip.g-tech{background:var(--tech);color:var(--techi)}.chip.g-type{background:var(--type);color:var(--typei)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;white-space:nowrap}
.st-todo{background:var(--type);color:var(--mute)}.st-in_progress{background:var(--run-soft);color:var(--run)}.st-review{background:var(--warn-soft);color:var(--warn)}.st-done{background:var(--ok-soft);color:var(--ok)}
.live{width:8px;height:8px;border-radius:50%;background:var(--run);display:inline-block;flex:none;animation:p 1.2s infinite}
@keyframes p{50%{opacity:.25}}
.livecard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--run);border-radius:10px;padding:12px 14px;cursor:pointer}
.livecard:hover{border-color:var(--accent)}
.liveline{color:var(--run);font-size:13px;display:flex;gap:6px;align-items:center;margin-top:4px}
.plan-card.has-live{border-left:3px solid var(--run)}
.nest{margin-top:4px;border-top:1px dashed var(--line);padding-top:10px}
.nest-h{display:flex;gap:6px;align-items:center;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--run);font-weight:700;margin-bottom:2px}
.ntask{padding:6px 8px;margin:0 -8px;border-radius:8px;cursor:pointer}
.ntask:hover{background:var(--run-soft)}
.ntask b{font-weight:600;font-size:13.5px}
.nag{position:relative;padding-left:24px;font-size:13px;color:var(--run);margin-top:3px}
.nag:before{content:"";position:absolute;left:7px;top:-5px;height:14px;width:11px;border-left:1px solid var(--faint);border-bottom:1px solid var(--faint);border-bottom-left-radius:4px}
.nag .who{color:var(--ink);font-weight:600}
.empty{color:var(--mute);background:var(--panel);border:1px dashed var(--line);border-radius:10px;padding:16px}
/* plan page */
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 0}
.subtabs a{padding:9px 14px;color:var(--mute);border-bottom:2px solid transparent;font-weight:500}
.subtabs a:hover{text-decoration:none;color:var(--ink)}.subtabs a.on{color:var(--accent);border-color:var(--accent)}
.doclayout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:40px;margin-top:24px}
.doc{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 32px 28px}
.doc h3{font-size:18px;margin:28px 0 8px;scroll-margin-top:20px}.doc h3 small{font-weight:400;color:var(--faint);font-size:13px;margin-left:6px}
.doc h4{font-size:14px;margin:16px 0 4px;scroll-margin-top:20px}
.toc{position:sticky;top:20px;align-self:start;font-size:13px}
.toc .kind{margin-bottom:8px}
.toc a{display:block;color:var(--mute);padding:3px 0 3px 10px;border-left:2px solid var(--line)}
.toc a:hover{color:var(--accent);border-color:var(--accent);text-decoration:none}
.toc a.l2{padding-left:24px;font-size:12.5px}
.trow{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;margin:8px 0;cursor:pointer}
.trow:hover{border-color:var(--accent);background:var(--accent-soft)}
.trow .t{flex:1;min-width:0}.trow .t b{font-weight:600}.trow .sub{color:var(--mute);font-size:12.5px}
.chev{color:var(--faint);font-size:18px}
.rel{background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin-top:12px;font-size:13px}
/* board */
.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.toolbar label{color:var(--mute);font-size:13px;display:flex;gap:6px;align-items:center}
.board{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}
.col{background:var(--panel);border:1px solid var(--line);border-radius:10px;flex:1 0 230px;min-width:230px;display:flex;flex-direction:column;max-height:calc(100vh - 250px)}
.col.drop{outline:2px dashed var(--accent);outline-offset:-2px}
.col .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;font-weight:600;border-bottom:1px solid var(--line)}
.col .list{overflow:auto;padding:8px;min-height:70px}
.card{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--accent)}.card.dragging{opacity:.4}
.card .pl{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ttl{font-weight:600;margin:4px 0 6px;line-height:1.35}
.card .ft{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.diff{font-size:12px;color:var(--mute);display:flex;gap:6px;align-items:center}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff;flex:none}
.pips i{display:inline-block;width:6px;height:10px;border-radius:2px;background:var(--line);margin-right:2px;vertical-align:middle}.pips i.f{background:var(--warn)}
/* map */
.maplayout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px}
.topics{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;align-self:start}
.topics h5{margin:10px 6px 4px;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.topic{display:flex;justify-content:space-between;padding:5px 8px;border-radius:6px;cursor:pointer;font-size:13px}
.topic:hover{background:var(--accent-soft)}.topic.on{background:var(--accent);color:#fff}.topic .n{opacity:.7;font-size:12px}
.gwrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.gwrap svg{display:block;width:100%;height:520px}
.gnode{cursor:pointer}.gnode text{font-size:12px;fill:var(--ink)}.dim{opacity:.12}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:10px}
.legend svg{vertical-align:middle;margin-right:4px}
.hint{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:10px 14px;margin-top:12px;font-size:13px}
/* drawer */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;height:100vh;width:min(500px,100vw);background:var(--panel);box-shadow:var(--shadow);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;z-index:10}
#drawer.on{transform:none}
.dh{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.dh .sp{flex:1;min-width:0;color:var(--mute);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.db{padding:20px 22px 40px;overflow:auto;flex:1}
.db h2{margin:2px 0 10px;font-size:20px;line-height:1.3}
.box{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:14px 0}
.box .kind{margin-bottom:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{flex:1;border:0;border-radius:0;border-right:1px solid var(--line);padding:7px 4px;background:none}
.seg button:last-child{border-right:0}.seg button.on{font-weight:700}
.seg button.on.st-todo{background:var(--type)}.seg button.on.st-in_progress{background:var(--run-soft);color:var(--run)}.seg button.on.st-review{background:var(--warn-soft);color:var(--warn)}.seg button.on.st-done{background:var(--ok-soft);color:var(--ok)}
.agentrow{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.agentrow .who{font-weight:600}.agentrow .what{color:var(--run)}
.tl{list-style:none;margin:0;padding:0}
.tl li{position:relative;padding:0 0 12px 22px;font-size:13px}
.tl li:before{content:"";position:absolute;left:5px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--line)}
.tl li:after{content:"";position:absolute;left:8px;top:16px;bottom:0;width:1px;background:var(--line)}
.tl li:last-child:after{display:none}
.tl .time{color:var(--faint);font-size:12px;margin-right:6px}
.raw{display:none;font-family:ui-monospace,monospace;font-size:11.5px;color:var(--faint)}
.showraw .raw{display:block}
.mini{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:8px;cursor:pointer;border:1px solid var(--line);margin:6px 0}
.mini:hover{border-color:var(--accent)}
#toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;transition:transform .2s;z-index:20}
#toast.on{transform:translate(-50%,0)}
@media (max-width:900px){.shell{grid-template-columns:1fr;grid-template-rows:auto auto 1fr;height:auto}.top{grid-column:1;flex-wrap:wrap;padding:10px 16px}.logo{width:auto}
 .side{display:flex;flex-wrap:wrap;gap:4px;border-right:0;border-bottom:1px solid var(--line)}.side h6,.side .proj{display:none}
 .search{width:100%;order:3}.page{padding:20px 16px}.doclayout,.maplayout{grid-template-columns:1fr}.toc{display:none}.doc{padding:4px 16px 20px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="logo">🗺 Plan Atlas</div>
    <div class="crumbs" id="crumbs"></div>
    <div class="search" role="search"><span class="ic">🔍</span><input id="q" placeholder="Tìm plan, việc, chủ đề…" autocomplete="off" aria-label="Tìm kiếm"><kbd>/</kbd><div class="sres" id="sres"></div></div>
    <button class="livepill" id="livepill" data-act="activity"></button>
  </header>
  <aside class="side" id="side"></aside>
  <main id="main"></main>
</div>
<div id="scrim" data-act="close"></div>
<aside id="drawer" aria-label="Chi tiết"></aside>
<div id="toast"></div>

 const head=`<div class="kind">📄 Plan · ${p.id}</div><h1 class="page-title">${esc(p.title)}</h1>

/* ---------- Bản đồ kiến thức ---------- */
function buildGraph(){
 const nodes=ALL.map((p,i)=>({p,x:Math.cos(i*2.4)*200,y:Math.sin(i*2.4)*160,vx:0,vy:0}));
 const ix=Object.fromEntries(ALL.map((p,i)=>[p.id,i]));const edges=[],has=new Set();
 ALL.forEach(p=>(p.related||[]).forEach(r=>{edges.push({s:ix[p.id],t:ix[r.to],type:r.type,ex:true});has.add([ix[p.id],ix[r.to]].sort().join())}));
 if(M.tagEdges)for(let i=0;i<ALL.length;i++)for(let j=i+1;j<ALL.length;j++){const a=allTags(ALL[i]).filter(t=>!t.startsWith('type/')),sh=allTags(ALL[j]).filter(t=>a.includes(t));if(sh.length&&!has.has([i,j].join()))edges.push({s:i,t:j,sh,ex:false,w:sh.length})}
 for(let it=0;it<500;it++){
  for(let i=0;i<nodes.length;i++)for(let j=i+1;j<nodes.length;j++){const a=nodes[i],b=nodes[j];let dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy||1,f=40000/d2,d=Math.sqrt(d2);a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f}
  edges.forEach(e=>{const a=nodes[e.s],b=nodes[e.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,L=e.ex?240:340,k=e.ex?.02:.003*e.w,f=(d-L)*k;a.vx+=dx/d*f;a.vy+=dy/d*f;b.vx-=dx/d*f;b.vy-=dy/d*f});
  nodes.forEach(n=>{n.vx-=n.x*.006;n.vy-=n.y*.0096;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.6;n.vy*=.6})}
 return{nodes,edges}}
function mapHtml(){
 const {nodes,edges}=buildGraph(),xs=nodes.map(n=>n.x),ys=nodes.map(n=>n.y),pad=110;
 const vb=[Math.min(...xs)-pad,Math.min(...ys)-pad,Math.max(...xs)-Math.min(...xs)+pad*2,Math.max(...ys)-Math.min(...ys)+pad*2];
 const vis=p=>!M.tag||allTags(p).includes(M.tag),r=p=>12+p.tasks.length*3;
 const cnt={};ALL.forEach(p=>allTags(p).forEach(t=>cnt[t]=(cnt[t]||0)+1));
 const E=edges.map(e=>{const a=nodes[e.s],b=nodes[e.t],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1,rb=r(b.p)+5,dim=!(vis(a.p)&&vis(b.p))?'dim':'';
  return e.ex?`<g class="${dim}"><line x1="${a.x}" y1="${a.y}" x2="${b.x-dx/d*rb}" y2="${b.y-dy/d*rb}" stroke="var(--accent)" stroke-width="2" ${e.type=='relates_to'?'stroke-dasharray="2 4"':''} marker-end="url(#arr)"/></g>`
  :`<line class="${dim}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="var(--faint)" stroke-opacity=".5" stroke-width="${e.w}" stroke-dasharray="5 5"><title>Cùng chủ đề: ${e.sh.map(t=>tl(t).label).join(', ')}</title></line>`}).join('');
 const N=nodes.map(n=>{const p=n.p,R_=r(p),C=2*Math.PI*(R_+4),f=done(p)/p.tasks.length,t=p.title.length>32?p.title.slice(0,31)+'…':p.title;
  return `<g class="gnode ${vis(p)?'':'dim'}" transform="translate(${n.x},${n.y})" data-act="planpeek" data-plan="${p.id}">
   <circle r="${R_+4}" fill="none" stroke="var(--line)" stroke-width="3"/><circle r="${R_+4}" fill="none" stroke="var(--ok)" stroke-width="3" stroke-dasharray="${C*f} ${C}" transform="rotate(-90)"/>
   <circle r="${R_}" fill="${PCOLOR[p.project]}"/><text y="4" text-anchor="middle" style="fill:#fff;font-weight:700">${p.tasks.length}</text>
   <text y="${R_+22}" text-anchor="middle" paint-order="stroke" stroke="var(--panel)" stroke-width="4">${esc(t)}</text><title>${esc(p.title)} — bấm để xem</title></g>`}).join('');
 const sel=M.tag?ALL.filter(p=>allTags(p).includes(M.tag)):[];
 return `<h1 class="page-title">Bản đồ kiến thức</h1><p class="lead">Mỗi vòng tròn là một plan. Mũi tên nối hai plan khi plan này cần plan kia, đường đứt nối các plan cùng chủ đề. Chọn một chủ đề bên trái để xem những plan nào liên quan.</p>
 <div class="maplayout"><div class="topics"><div class="topic ${!M.tag?'on':''}" data-act="maptag" data-tag="">Tất cả plan<span class="n">${ALL.length}</span></div>
  ${Object.keys(GROUPS).map(g=>`<h5>${GROUPS[g]}</h5>${Object.keys(cnt).filter(t=>t.startsWith(g+'/')).sort((a,b)=>cnt[b]-cnt[a]).map(t=>`<div class="topic ${M.tag==t?'on':''}" data-act="maptag" data-tag="${t}" title="${esc(tl(t).desc)}">${esc(tl(t).label)}<span class="n">${cnt[t]} plan</span></div>`).join('')}`).join('')}</div>
 <div><div class="gwrap"><svg viewBox="${vb.join(' ')}" preserveAspectRatio="xMidYMid meet"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="var(--accent)"/></marker></defs>${E}${N}</svg></div>
  <div class="legend">${Object.entries(PCOLOR).map(([k,c])=>`<span><svg width="12" height="12"><circle cx="6" cy="6" r="6" fill="${c}"/></svg>${k}</span>`).join('')}
   <span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--accent)" stroke-width="2"/></svg>cần / mở rộng từ</span>
   <span><svg width="28" height="8"><line x1="0" y1="4" x2="28" y2="4" stroke="var(--faint)" stroke-width="2" stroke-dasharray="5 5"/></svg>cùng chủ đề</span>
   <span>Vòng xanh: phần việc đã xong · Số: số việc</span>
   <label style="margin-left:auto"><input type="checkbox" data-chg="tagEdges" ${M.tagEdges?'checked':''}> Hiện đường “cùng chủ đề”</label></div>
  ${M.tag?`<div class="hint"><b>${esc(tl(M.tag).label)}</b>: ${esc(tl(M.tag).desc)} Có ${sel.length} plan thuộc chủ đề này: ${sel.map(p=>`<a data-act="planpeek" data-plan="${p.id}">${esc(p.title)}</a>`).join(', ')}.</div>`:'<div class="hint">💡 Bấm vào một vòng tròn để xem tóm tắt plan, không rời khỏi bản đồ.</div>'}
 </div></div>`}

 ws.forEach(w=>{let i=n.indexOf(w);while(i>-1){for(let k=i;k<i+w.length;k++)m[k]=1;i=n.indexOf(w,i+1)}});
 let o='',open=0;t.split('').forEach((c,i)=>{if(m[i]&&!open){o+='<mark>';open=1}if(!m[i]&&open){o+='</mark>';open=0}o+=esc(c)});return o+(open?'</mark>':'')}

  if(!html)html=`<div class="snone">Không tìm thấy “${esc(q)}”. Thử từ khoá khác, ví dụ: <i>bảo mật</i>, <i>3D</i>, <i>token</i>.</div>`}
 box.innerHTML=html+'<div class="sfoot">↑ ↓ để chọn · Enter để mở · Esc để đóng · gõ không dấu cũng được</div>';box.classList.add('on');sSel=0;markSel()}

const qEl=document.getElementById('q');
qEl.addEventListener('input',renderSearch);qEl.addEventListener('focus',renderSearch);
qEl.addEventListener('keydown',e=>{const n=document.querySelectorAll('#sres .sitem').length;
 if(e.key=='ArrowDown'){e.preventDefault();sSel=Math.min(sSel+1,n-1);markSel()}
 else if(e.key=='ArrowUp'){e.preventDefault();sSel=Math.max(sSel-1,0);markSel()}
 else if(e.key=='Enter'){document.querySelectorAll('#sres .sitem')[sSel]?.click()}
 else if(e.key=='Escape'){hideSearch(true)}});
document.addEventListener('click',e=>{if(e.target.closest('#sres .sitem'))hideSearch(true);else if(!e.target.closest('.search'))hideSearch()});
document.addEventListener('keydown',e=>{const typing=/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName);
 if((e.key=='/'&&!typing)||(e.key.toLowerCase()=='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();qEl.focus();qEl.select()}});

parse();renderAll();
</script>
</body>
</html>
